name: Vendor Boundary Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vendor-boundary:
    name: Cross-vendor change detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The boundary rule is PER COMMIT (same as .githooks/pre-commit): a single
      # commit must never mix _lk_tax/ and _standard/. A push or PR may
      # legitimately contain a Sakura-only commit AND a WHEEL MART-only commit,
      # so diffing the whole range would falsely fail — check each commit.
      - name: Check for cross-vendor changes (per commit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi

          FAIL=0
          for C in $(git rev-list --no-merges "$RANGE"); do
            FILES=$(git show --name-only --format= "$C")
            LK_TAX=$(echo "$FILES"   | grep "_lk_tax/"   || true)
            STANDARD=$(echo "$FILES" | grep "_standard/" || true)
            if [ -n "$LK_TAX" ] && [ -n "$STANDARD" ]; then
              echo ""
              echo "╔══════════════════════════════════════════════════════════════╗"
              echo "║  ❌  CROSS-VENDOR CHANGE DETECTED                          ║"
              echo "╚══════════════════════════════════════════════════════════════╝"
              echo ""
              echo "Commit $C touches BOTH vendor folders:"
              echo ""
              echo "  WHEEL MART  (_lk_tax/):"
              echo "$LK_TAX" | sed 's/^/    /'
              echo ""
              echo "  Sakura Auto (_standard/):"
              echo "$STANDARD" | sed 's/^/    /'
              echo ""
              echo "Split each vendor's changes into separate commits."
              FAIL=1
            fi
          done

          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "✅ Every commit respects the vendor boundary"

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: ESLint (vendor boundary imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Only fail on cross-vendor import violations — ignore pre-existing any/unused-var noise
      - name: Check for cross-vendor imports
        run: |
          set +e
          npx eslint src/app/vendor/_lk_tax/ src/app/vendor/_standard/ --format json > /tmp/eslint-out.json 2>&1
          node -e "
            const fs = require('fs');
            let results;
            try { results = JSON.parse(fs.readFileSync('/tmp/eslint-out.json', 'utf8')); }
            catch { console.log('✅ ESLint output could not be parsed — skipping'); process.exit(0); }
            const violations = results.flatMap(r =>
              (r.messages || [])
                .filter(m => m.ruleId === 'no-restricted-imports')
                .map(m => r.filePath.split('src/').pop() + ':' + m.line + '  ' + m.message)
            );
            if (violations.length > 0) {
              console.error('');
              console.error('❌  CROSS-VENDOR IMPORT VIOLATIONS');
              console.error('   A file is importing from the wrong vendor folder.');
              console.error('');
              violations.forEach(v => console.error('   ' + v));
              console.error('');
              process.exit(1);
            }
            console.log('✅ No cross-vendor imports detected');
          "
